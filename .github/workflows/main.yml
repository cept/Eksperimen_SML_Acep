name: Data Preprocessing Workflow

# Workflow akan berjalan setiap ada push ke branch main atau dijalankan manual
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preprocess-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn joblib

    - name: Run Automation Script
      run: |
        cd preprocessing
        python automate_Acep.py

    - name: Commit and Push Processed Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add preprocessing/PRDECT-ID_preprocessing.csv
        git add preprocessing/tfidf_vectorizer.pkl
        # Hanya commit jika ada perubahan data
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update processed dataset & artifacts" && git push)
